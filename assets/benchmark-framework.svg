<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 435" width="1080" height="435" role="img"><title>CipherOpBench benchmark architecture</title><desc>Synthetic inputs or BERT fixtures feed benchmark drivers. Drivers select operator implementations on the shared CKKS GPU backend and validate and report the measurements.</desc><rect x="1" y="1" width="1078" height="433" rx="18" fill="#F6F5FA" stroke="#DFDCEB" /><text x="31" y="51" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#28223F">CipherOpBench</text><text x="32" y="82" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#514964">How an encrypted operator is timed and checked</text><rect x="28" y="110" width="308" height="105" rx="12" fill="#FFFFFF" stroke="#D5D1E3" /><text x="45" y="141" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#28223F">Workload</text><text x="45" y="172" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#28223F">Synthetic tensors</text><text x="45" y="195" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#28223F">or BERT trace fixtures</text><rect x="368" y="110" width="308" height="105" rx="12" fill="#FFFFFF" stroke="#D5D1E3" /><text x="385" y="141" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#28223F">Benchmark driver</text><text x="385" y="172" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#28223F">BERT single / batch</text><text x="385" y="195" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#28223F">Llama decoder scopes</text><rect x="711" y="110" width="308" height="105" rx="12" fill="#FFFFFF" stroke="#D5D1E3" /><text x="728" y="141" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#28223F">Encrypted operators</text><text x="728" y="172" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#28223F">MatMul, attention, FFN</text><text x="728" y="195" font-family="system-ui, sans-serif" font-size="19" font-weight="400" fill="#28223F">and normalization</text><line x1="337" y1="161" x2="365" y2="161" stroke="#7662AA" stroke-width="2" /><polyline points="358,156 365,161 358,166" fill="none" stroke="#7662AA" stroke-width="2" /><line x1="678" y1="161" x2="707" y2="161" stroke="#7662AA" stroke-width="2" /><polyline points="700,156 707,161 700,166" fill="none" stroke="#7662AA" stroke-width="2" /><line x1="866" y1="217" x2="866" y2="244" stroke="#7662AA" stroke-width="2" /><polyline points="861,237 866,244 871,237" fill="none" stroke="#7662AA" stroke-width="2" /><rect x="711" y="247" width="308" height="76" rx="12" fill="#EAE4FC" stroke="#D5C8EF" /><text x="728" y="277" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#28223F">CKKS runtime</text><text x="728" y="305" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#28223F">PhantomFHE · CUDA GPU</text><line x1="522" y1="217" x2="522" y2="244" stroke="#7662AA" stroke-width="2" /><polyline points="517,237 522,244 527,237" fill="none" stroke="#7662AA" stroke-width="2" /><rect x="368" y="247" width="308" height="76" rx="12" fill="#E3F4EB" stroke="#C3E1D3" /><text x="385" y="277" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#28223F">Validate and record</text><text x="385" y="305" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#28223F">Plaintext comparison · JSONL</text><line x1="709" y1="285" x2="679" y2="285" stroke="#7662AA" stroke-width="2" /><polyline points="686,280 679,285 686,290" stroke="#7662AA" stroke-width="2" fill="none" /><line x1="29" y1="352" x2="1019" y2="352" stroke="#D5D1E3" stroke-width="1" /><text x="31" y="386" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#28223F">BERT timing record</text><text x="254" y="386" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#28223F">Per-run samples (ms), median latency, mean absolute error and validation status.</text></svg>